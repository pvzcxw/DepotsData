
name: Update DepotKeys

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-depotkeys:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download depotkeys.json
        run: |
          set -e

          curl -fL --retry 3 \
            "https://api.993499094.xyz/depotkeys.json" \
            -o depotkeys.json

          if [ ! -s depotkeys.json ]; then
            echo "下载失败：文件为空！"
            exit 1
          fi

          python -m json.tool depotkeys.json > /dev/null

          echo "文件下载成功，JSON 格式验证通过！"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 强制添加文件，兼容文件此前不存在或被忽略的情况
          git add -f depotkeys.json

          # 检查暂存区是否存在变化
          if git diff --cached --quiet; then
            echo "文件内容没有变化，无需提交。"
            exit 0
          fi

          git commit -m "Update depotkeys.json"

          git push origin HEAD:${GITHUB_REF_NAME}

          echo "depotkeys.json 已成功更新到仓库！"
